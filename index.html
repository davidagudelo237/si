<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Calorías - Almuerzo Colombiano Extendido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }
        /* Estilo para un scrollbar más sutil */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }
        .sticky-summary {
            position: -webkit-sticky;
            position: sticky;
            top: 1.5rem; /* 24px */
        }
        /* Las categorías ocupan todo el ancho en la lista de alimentos */
        .category-title-container {
            grid-column: 1 / -1; /* Ocupa todas las columnas */
        }
    </style>
</head>
<body class="text-gray-800">

    <div class="container mx-auto p-4 md:p-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-slate-800">Calculadora de Calorías 🍲</h1>
            <p class="text-slate-600 mt-2">Estima las calorías de tu almuerzo colombiano, ¡versión extendida!</p>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div id="food-list" class="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                </div>

            <div class="lg:col-span-1">
                <div class="sticky-summary bg-white p-6 rounded-2xl shadow-lg">
                    <h2 class="text-2xl font-semibold mb-4 border-b pb-3 text-slate-700">Resumen del Almuerzo</h2>
                    <div id="summary-items" class="custom-scrollbar max-h-80 overflow-y-auto pr-2">
                        <p id="empty-summary-message" class="text-gray-500 text-center py-4">Selecciona alimentos para ver el resumen aquí.</p>
                        </div>
                    <div class="mt-6 border-t pt-4">
                        <div class="flex justify-between items-center text-xl font-bold">
                            <span class="text-slate-800">TOTAL:</span>
                            <span id="total-calories" class="text-emerald-600">0 Kcal</span>
                        </div>
                        <button id="reset-button" class="w-full mt-6 bg-rose-500 text-white font-semibold py-3 rounded-lg hover:bg-rose-600 transition-colors duration-300 shadow-sm disabled:bg-gray-300 disabled:cursor-not-allowed">
                            Limpiar Selección
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Datos de alimentos extendidos para un almuerzo colombiano
            // Calorías aproximadas por 100g de porción comestible cocinada
            const foodData = [
                // --- Platos Fuertes Típicos / Bases ---
                { Categoria: "Platos Típicos", Alimento: "Bandeja Paisa (Estimado)", Calorias: 400 }, // Estimado por 100g, plato completo ~1200+
                { Categoria: "Platos Típicos", Alimento: "Ajiaco Santafereño (Sopa)", Calorias: 80 },
                { Categoria: "Platos Típicos", Alimento: "Sancocho de Gallina (Sopa)", Calorias: 95 },
                { Categoria: "Platos Típicos", Alimento: "Tamal (relleno promedio)", Calorias: 240 },
                { Categoria: "Platos Típicos", Alimento: "Fritanga (Estimado)", Calorias: 350 },
                
                // --- Cereales y Carbohidratos ---
                { Categoria: "Cereales y Harinas", Alimento: "Arroz blanco cocido", Calorias: 130 },
                { Categoria: "Cereales y Harinas", Alimento: "Arroz integral cocido", Calorias: 111 },
                { Categoria: "Cereales y Harinas", Alimento: "Arepa de maíz blanco (mediana)", Calorias: 270 },
                { Categoria: "Cereales y Harinas", Alimento: "Arepa de choclo con queso", Calorias: 250 },
                { Categoria: "Cereales y Harinas", Alimento: "Pan de bono", Calorias: 300 },
                { Categoria: "Cereales y Harinas", Alimento: "Empanada frita (promedio)", Calorias: 280 },
                
                // --- Legumbres (Granos) ---
                { Categoria: "Legumbres (Granos)", Alimento: "Frijoles rojos cocidos (guisados)", Calorias: 150 }, // Con algo de grasa
                { Categoria: "Legumbres (Granos)", Alimento: "Lentejas cocidas (guisadas)", Calorias: 130 },
                { Categoria: "Legumbres (Granos)", Alimento: "Garbanzos cocidos (guisados)", Calorias: 180 },
                { Categoria: "Legumbres (Granos)", Alimento: "Arvejas secas cocidas (guisadas)", Calorias: 100 },
                
                // --- Proteínas (Carnes y Sustitutos) ---
                { Categoria: "Proteínas", Alimento: "Carne de res asada (magra)", Calorias: 200 },
                { Categoria: "Proteínas", Alimento: "Carne de res guisada/en salsa", Calorias: 250 },
                { Categoria: "Proteínas", Alimento: "Pollo sudado/guisado (sin piel)", Calorias: 165 },
                { Categoria: "Proteínas", Alimento: "Pechuga de pollo a la plancha", Calorias: 165 },
                { Categoria: "Proteínas", Alimento: "Chicharrón de cerdo (trozo frito)", Calorias: 660 },
                { Categoria: "Proteínas", Alimento: "Chorizo colombiano (unidad)", Calorias: 350 },
                { Categoria: "Proteínas", Alimento: "Pescado frito (Mojarra/Tilapia)", Calorias: 280 },
                { Categoria: "Proteínas", Alimento: "Huevo frito (unidad)", Calorias: 201 },
                { Categoria: "Proteínas", Alimento: "Huevo cocido (unidad)", Calorias: 155 },
                { Categoria: "Proteínas", Alimento: "Queso Costeño (porcion)", Calorias: 350 },

                // --- Tubérculos y Plátanos ---
                { Categoria: "Tubérculos y Plátanos", Alimento: "Papa salada/cocida", Calorias: 89 },
                { Categoria: "Tubérculos y Plátanos", Alimento: "Papa frita (tipo francesa)", Calorias: 312 },
                { Categoria: "Tubérculos y Plátanos", Alimento: "Yuca cocida", Calorias: 160 },
                { Categoria: "Tubérculos y Plátanos", Alimento: "Yuca frita", Calorias: 330 },
                { Categoria: "Tubérculos y Plátanos", Alimento: "Plátano maduro frito (tajada)", Calorias: 221 },
                { Categoria: "Tubérculos y Plátanos", Alimento: "Patacón (plátano verde frito)", Calorias: 250 },
                { Categoria: "Tubérculos y Plátanos", Alimento: "Papa criolla frita", Calorias: 300 },
                
                // --- Ensaladas y Verduras (Crudas/Cocidas) ---
                { Categoria: "Ensaladas y Verduras", Alimento: "Aguacate (porcion)", Calorias: 160 },
                { Categoria: "Ensaladas y Verduras", Alimento: "Tomate y Cebolla (sin aderezo)", Calorias: 25 },
                { Categoria: "Ensaladas y Verduras", Alimento: "Lechuga y Pepino (sin aderezo)", Calorias: 15 },
                { Categoria: "Ensaladas y Verduras", Alimento: "Remolacha cocida", Calorias: 43 },
                { Categoria: "Ensaladas y Verduras", Alimento: "Zanahoria rallada", Calorias: 41 },
                
                // --- Aderezos, Aceites y Extras ---
                { Categoria: "Aderezos y Extras", Alimento: "Mayonesa (cucharada/15g)", Calorias: 105 },
                { Categoria: "Aderezos y Extras", Alimento: "Salsa de Tomate (cucharada/15g)", Calorias: 15 },
                { Categoria: "Aderezos y Extras", Alimento: "Aceite vegetal (cucharada/15ml)", Calorias: 124 },
                { Categoria: "Aderezos y Extras", Alimento: "Mantequilla (cucharada/14g)", Calorias: 100 },
                { Categoria: "Aderezos y Extras", Alimento: "Hogao / Guiso (porción)", Calorias: 100 },
                
                // --- Bebidas Típicas (Sin Azúcar Añadida) ---
                { Categoria: "Bebidas", Alimento: "Limonada natural (sin azúcar)", Calorias: 10 },
                { Categoria: "Bebidas", Alimento: "Jugo de Maracuyá (sin azúcar)", Calorias: 35 },
                { Categoria: "Bebidas", Alimento: "Jugo de Mora (sin azúcar)", Calorias: 38 },
                { Categoria: "Bebidas", Alimento: "Avena (vaso/250ml)", Calorias: 150 },
                { Categoria: "Bebidas", Alimento: "Agua de Panela (vaso/250ml)", Calorias: 100 },
                
                // --- Postres (por porción estimada) ---
                { Categoria: "Postres", Alimento: "Arequipe (cucharada/30g)", Calorias: 90 },
                { Categoria: "Postres", Alimento: "Brevas con Arequipe (unidad)", Calorias: 180 },
                { Categoria: "Postres", Alimento: "Bocadillo Veleño (porción)", Calorias: 85 },
                { Categoria: "Postres", Alimento: "Claro (Bebida de Maíz)", Calorias: 50 }
            ];

            const foodListContainer = document.getElementById('food-list');
            const summaryItemsContainer = document.getElementById('summary-items');
            const totalCaloriesEl = document.getElementById('total-calories');
            const resetButton = document.getElementById('reset-button');
            const emptySummaryMessage = document.getElementById('empty-summary-message');

            let selectedItems = {};

            // Agrupar alimentos por categoría
            const groupedFoods = foodData.reduce((acc, food) => {
                const category = food.Categoria;
                if (!acc[category]) {
                    acc[category] = [];
                }
                acc[category].push(food);
                return acc;
            }, {});

            // Renderizar la lista de alimentos
            for (const category in groupedFoods) {
                // Contenedor para el título de la categoría
                const categoryContainer = document.createElement('div');
                categoryContainer.className = "category-title-container"; 

                const categoryTitle = document.createElement('h2');
                categoryTitle.className = "text-xl font-bold text-slate-800 border-b-2 border-emerald-500 pb-2 mt-6 mb-4";
                categoryTitle.textContent = category;
                categoryContainer.appendChild(categoryTitle);
                foodListContainer.appendChild(categoryContainer);
                
                groupedFoods[category].forEach(food => {
                    const card = document.createElement('div');
                    card.className = "bg-white p-4 rounded-xl shadow-md transition-shadow hover:shadow-lg";
                    
                    const foodName = document.createElement('h3');
                    foodName.className = "font-semibold truncate";
                    foodName.textContent = food.Alimento;
                    
                    const foodCalories = document.createElement('p');
                    foodCalories.className = "text-sm text-gray-500 mb-3";
                    
                    // Mostrar "por 100g" para la mayoría, o "por porción/unidad" para otros
                    const unitText = food.Alimento.includes('(unidad)') || food.Alimento.includes('(vaso') || food.Alimento.includes('(cucharada') || food.Alimento.includes('(porción)') || food.Alimento.includes('(Estimado)') ? 'por unidad/porción' : 'Kcal por 100g';
                    foodCalories.textContent = `${food.Calorias} ${unitText}`;

                    const inputGroup = document.createElement('div');
                    inputGroup.className = "flex items-center";

                    const input = document.createElement('input');
                    input.type = "number";
                    input.min = "0";
                    input.placeholder = food.Alimento.includes('(unidad)') || food.Alimento.includes('(vaso') || food.Alimento.includes('(cucharada') || food.Alimento.includes('(porción)') || food.Alimento.includes('(Estimado)') ? 'Unidades/Porciones' : 'Gramos';
                    input.className = "w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500";
                    input.dataset.name = food.Alimento;
                    input.dataset.calories = food.Calorias;
                    input.dataset.isPortion = food.Alimento.includes('(unidad)') || food.Alimento.includes('(vaso') || food.Alimento.includes('(cucharada') || food.Alimento.includes('(porción)') || food.Alimento.includes('(Estimado)') ? 'true' : 'false';
                    
                    input.addEventListener('input', handleInputChange);

                    card.appendChild(foodName);
                    card.appendChild(foodCalories);
                    
                    if (food.Alimento.includes('(Estimado)')) {
                         const warning = document.createElement('p');
                         warning.className = "text-xs text-rose-500 mt-1";
                         warning.textContent = "¡Usa solo una unidad! Es una estimación del plato completo.";
                         card.appendChild(warning);
                    }
                    
                    inputGroup.appendChild(input);
                    card.appendChild(inputGroup);
                    foodListContainer.appendChild(card);
                });
            }

            function handleInputChange(event) {
                const input = event.target;
                const foodName = input.dataset.name;
                const caloriesPerUnit = parseInt(input.dataset.calories);
                const quantity = parseFloat(input.value) || 0;
                const isPortion = input.dataset.isPortion === 'true';
                
                // Para Platos Típicos (estimaciones de plato completo), limitar a 1
                if (foodName.includes('(Estimado)') && quantity > 1) {
                    input.value = 1;
                }

                if (quantity > 0) {
                    selectedItems[foodName] = { quantity, caloriesPerUnit, isPortion };
                } else {
                    delete selectedItems[foodName];
                }
                updateSummary();
            }

            function updateSummary() {
                summaryItemsContainer.innerHTML = '';
                let totalCalories = 0;
                const hasItems = Object.keys(selectedItems).length > 0;

                if (hasItems) {
                    emptySummaryMessage.style.display = 'none';
                    for (const foodName in selectedItems) {
                        const item = selectedItems[foodName];
                        let itemCalories;
                        let unitDisplay;
                        
                        if (item.isPortion) {
                            // Cálculo para Unidades/Porciones
                            itemCalories = item.quantity * item.caloriesPerUnit;
                            unitDisplay = item.quantity === 1 ? 'porción' : (foodName.includes('(unidad)') ? 'unidades' : 'porciones');
                        } else {
                            // Cálculo para Gramos
                            itemCalories = (item.quantity / 100) * item.caloriesPerUnit;
                            unitDisplay = 'g';
                        }
                        
                        totalCalories += itemCalories;
                        
                        const summaryItem = document.createElement('div');
                        summaryItem.className = "flex justify-between items-center py-2 border-b last:border-b-0";
                        
                        const itemName = document.createElement('span');
                        itemName.className = "text-sm font-medium w-3/5 truncate";
                        itemName.textContent = `${foodName} (${item.quantity}${unitDisplay})`;
                        
                        const itemCal = document.createElement('span');
                        itemCal.className = "text-sm font-semibold text-emerald-600";
                        itemCal.textContent = `${Math.round(itemCalories)} Kcal`;

                        summaryItem.appendChild(itemName);
                        summaryItem.appendChild(itemCal);
                        summaryItemsContainer.appendChild(summaryItem);
                    }
                } else {
                    summaryItemsContainer.appendChild(emptySummaryMessage);
                    emptySummaryMessage.style.display = 'block';
                }

                totalCaloriesEl.textContent = `${Math.round(totalCalories)} Kcal`;
                resetButton.disabled = !hasItems;
            }

            resetButton.addEventListener('click', () => {
                selectedItems = {};
                document.querySelectorAll('#food-list input').forEach(input => input.value = '');
                updateSummary();
            });
            
            // Estado inicial del botón de limpiar
            resetButton.disabled = true;
        });
    </script>
</body>
</html>
